<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="icon" type="image/png" href="images/favicon.png">

<body data-page="home" data-root="">
  <div id="site-header"></div>
  <main>

    <section class="hero">
      <!-- Background video: silent, loops forever. Swap images/hero-bg.mp4 to change it. -->
      <video class="hero-bg" src="images/hero-bg.mp4" poster="images/hero-poster.jpg" autoplay muted loop playsinline preload="auto" aria-hidden="true"></video>
      <div class="hero-shade"></div>
      <div class="container hero-content">
        <img class="hero-logo" src="images/logo.png" alt="iLL RAiSED logo">
        <h1 class="keep-case">iLL RAiSED / MALCRiADOS</h1>
        <p class="tagline">QUEENS, NY</p>
        <a class="btn" href="https://illraised.bandcamp.com/album/malcriados" target="_blank" rel="noopener">Support us on Bandcamp</a>
      </div>
    </section>

    <section class="section-alt">
      <div class="container album">
        <img src="images/malcriados-cover.jpg" alt="MALCRiADOS album cover" width="720" height="720" loading="lazy">
        <div>
          <h2 class="keep-case">MALCRiADOS</h2>
          <p class="tagline muted">(NEW ALBUM SAME ATTITUDE)</p>
          <p>The long awaited album is here....</p>
          <a class="btn" href="https://illraised.bandcamp.com/album/malcriados" target="_blank" rel="noopener">Support</a>
        </div>
      </div>
    </section>

    <section id="videos">
      <div class="container">
        <h2 class="center">Videos</h2>
        <div class="video-grid" id="video-grid"></div>
      </div>
    </section>

    <section class="section-alt center">
      <div class="container">
        <h2>T.D.M.</h2>
        <!-- This section was empty on the old site. Add text here or delete the whole <section>. -->
      </div>
    </section>

    <section class="center">
      <div class="container">
        <h2>Upcoming Shows</h2>
        <p><a class="btn btn-outline" href="shows/">See all shows</a></p>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="js/site-data.js"></script>
  <script src="js/main.js"></script>
